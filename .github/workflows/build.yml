# Builds the Android app on GitHub's servers every time you upload changes,
# then publishes the APK on the repo's "Releases" page so you can download it on your phone.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CleanBrowser.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CleanBrowser-apk
          path: CleanBrowser.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Clean Browser (build ${{ github.run_number }})
          body: Download **CleanBrowser.apk** below and open it on your Android phone.
          files: CleanBrowser.apk
          make_latest: true
