plugins {
    id 'com.android.application'
}

android {
    namespace 'com.utkarsh.cleanbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.utkarsh.cleanbrowser'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
