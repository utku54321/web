plugins {
    id 'com.android.application'
}

android {
    namespace 'com.utkarsh.cleanbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.utkarsh.cleanbrowser'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Same signing key for every build, so new APKs install over the old one.
    // The key is stored in app/debug.keystore.b64 and decoded by the GitHub workflow.
    if (file('debug.keystore').exists()) {
        signingConfigs {
            debug {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
